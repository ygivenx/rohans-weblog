services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weblog}
      POSTGRES_USER: ${POSTGRES_USER:-weblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weblog}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: postgres:16-alpine
    mem_limit: 64m
    volumes:
      - postgres_backups:/backups
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-weblog}
      PGUSER: ${POSTGRES_USER:-weblog}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        ts=$$(date -u +%Y%m%dT%H%M%SZ);
        pg_dump --no-owner --no-acl | gzip -c > "/backups/weblog-$$ts.sql.gz" &&
          find /backups -name "weblog-*.sql.gz" -mtime +14 -delete;
        sleep 24h & wait $${!};
      done'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: rohans-weblog:latest
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             { (while :; do python manage.py sync_briefing_email || true; sleep 15m; done) & } &&
             exec gunicorn --bind 0.0.0.0:8000 --preload --worker-class gthread --workers 3 --threads 2 --timeout 60 --max-requests 1000 --max-requests-jitter 100 rohans_weblog.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB:-weblog}
      POSTGRES_USER: ${POSTGRES_USER:-weblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      WEBHOOK_GITHUB_SECRET: ${WEBHOOK_GITHUB_SECRET}
      GITHUB_OWNER: ${GITHUB_OWNER}
      GUMROAD_ACCESS_TOKEN: ${GUMROAD_ACCESS_TOKEN}
      GUMROAD_WEBHOOK_TOKEN: ${GUMROAD_WEBHOOK_TOKEN}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      BRIEFINGS_FEED_MIRROR: ${BRIEFINGS_FEED_MIRROR:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; h = os.environ.get('DJANGO_ALLOWED_HOSTS', 'localhost').split(',')[0].strip(); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/about/', headers={'Host': h, 'X-Forwarded-Proto': 'https'}), timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  hackerstack-indexer:
    image: rohans-weblog:latest
    build: .
    command: python manage.py run_hackerstack_worker
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - hackerstack_cache:/app/.cache/hackerstack
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      POSTGRES_DB: ${POSTGRES_DB:-weblog}
      POSTGRES_USER: ${POSTGRES_USER:-weblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      # Optional review keys (Jev preferred): with neither, the daily review step is skipped, never failed.
      JEV_API_KEY: ${JEV_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    # Reload every 6h so renewed certs are picked up
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & exec nginx -g "daemon off;"'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  hackerstack_cache:
  postgres_data:
  postgres_backups:
  static_volume:
  media_volume:
  certbot_conf:
  certbot_www:
